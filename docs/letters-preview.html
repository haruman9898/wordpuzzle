<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字データ 一覧 (Claude案)</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#23211d; --sub:#7a766c; --slot:#cfcabd; --line:#e4e0d6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --card:#212328; --ink:#eeece6; --sub:#9b9a93; --slot:#4a4d55; --line:#32353c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:16px}
h1{font-size:19px;margin:4px 0 2px}
h2{font-size:16px;margin:28px 0 8px}
p.note{color:var(--sub);margin:4px 0 12px;font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:sticky;top:8px;z-index:5}
.ctl label{display:flex;align-items:center;gap:8px;font-size:14px}
.ctl input[type=range]{width:140px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.card .row{display:flex;gap:8px;justify-content:center}
.card svg{width:64px;height:107px;flex:none}
.card .cap{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
.card .cap b{color:var(--ink);font-size:14px}
.phone{width:min(100%,390px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;margin:6px 0}
.phone .w{display:flex;justify-content:center;margin:2px 0}
.phone .w svg{flex:none;display:block;margin:0 3px}
.phone .t{font-size:11px;color:var(--sub);text-align:center}
svg{overflow:visible}
svg .p{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:var(--sw,12px)}
svg .s{stroke:var(--slot)}
svg .m{stroke:var(--ink)}
</style>
</head>
<body>
<h1>文字データ 一覧（Claude案）</h1>
<p class="note">分解表 v0.6 の式どおりに、全26文字をパーツのデータとして定義したものです。線の太さ・縦横比・角の丸さを全文字で統一しています。</p>

<div class="ctl">
  <label>線の太さ <input id="sw" type="range" min="6" max="18" step="1" value="12"><span id="swv">12</span></label>
  <label><input id="col" type="checkbox" checked>パーツを色分け</label>
</div>
<div class="legend" id="legend"></div>

<h2>A–Z（左: パーツ色分け ／ 右: 枠の見え方）</h2>
<div class="grid" id="grid"></div>

<h2>単語での見え方（スマホ幅 390px 想定）</h2>
<p class="note">上段が空の枠、下段が完成形。5文字（APPLE, WATER）は文字が小さくなる限界の確認用です。</p>
<div id="words"></div>

<script>
/* ===== 文字データ =====
   座標系: viewBox 0 0 60 100。文字の本体は x 10–50, y 10–90。
   各パーツ {t: 型名, d: SVGパス}。線は太さ一定・丸端・丸角で描画する。
   型: I 直線 / C 半円カーブ / V 角 / L 直角 / D D型 / O O型 / P P型 / F F型 / J フック */
const R_ = (a)=>a; // 見やすさ用のダミー
const LETTERS = {
  A:[{t:'V',d:'M10 90 L30 10 L50 90'},{t:'I',d:'M17 62 H43'}],
  B:[{t:'D',d:'M10 10 H30 A20 20 0 0 1 50 30 A20 20 0 0 1 30 50 H10 Z'},
     {t:'D',d:'M10 50 H30 A20 20 0 0 1 50 70 A20 20 0 0 1 30 90 H10 Z'}],
  C:[{t:'C',d:'M50 10 H30 A20 20 0 0 0 10 30 V70 A20 20 0 0 0 30 90 H50'}],
  D:[{t:'I',d:'M10 10 V90'},{t:'C',d:'M10 10 H30 A20 20 0 0 1 50 30 V70 A20 20 0 0 1 30 90 H10'}],
  E:[{t:'F',d:'M50 10 H10 V90 M10 50 H40'},{t:'I',d:'M10 90 H50'}],
  F:[{t:'L',d:'M50 10 H10 V90'},{t:'I',d:'M10 50 H40'}],
  G:[{t:'C',d:'M50 10 H30 A20 20 0 0 0 10 30 V70 A20 20 0 0 0 30 90 H50'},{t:'L',d:'M32 52 H50 V90'}],
  H:[{t:'I',d:'M10 10 V90'},{t:'I',d:'M50 10 V90'},{t:'I',d:'M10 50 H50'}],
  I:[{t:'I',d:'M30 10 V90'}],
  J:[{t:'J',d:'M46 10 V66 A24 24 0 0 1 22 90'}],
  K:[{t:'I',d:'M10 10 V90'},{t:'V',d:'M50 10 L10 50 L50 90'}],
  L:[{t:'L',d:'M10 10 V90 H50'}],
  M:[{t:'I',d:'M10 90 V10'},{t:'V',d:'M10 10 L30 56 L50 10'},{t:'I',d:'M50 10 V90'}],
  N:[{t:'V',d:'M10 90 V10 L50 90'},{t:'I',d:'M50 10 V90'}],
  O:[{t:'C',d:'M30 10 A20 20 0 0 0 10 30 V70 A20 20 0 0 0 30 90'},{t:'C',d:'M30 10 A20 20 0 0 1 50 30 V70 A20 20 0 0 1 30 90'}],
  P:[{t:'I',d:'M10 10 V90'},{t:'C',d:'M10 10 H27 A23 23 0 0 1 50 33 A23 23 0 0 1 27 56 H10'}],
  Q:[{t:'O',d:'M30 10 A20 20 0 0 1 50 30 V70 A20 20 0 0 1 30 90 A20 20 0 0 1 10 70 V30 A20 20 0 0 1 30 10 Z'},{t:'I',d:'M36 68 L52 90'}],
  R:[{t:'P',d:'M10 10 V90 M10 10 H27 A23 23 0 0 1 50 33 A23 23 0 0 1 27 56 H10'},{t:'I',d:'M27 56 L50 90'}],
  S:[{t:'C',d:'M50 10 H30 A20 20 0 0 0 10 30 A20 20 0 0 0 30 50'},{t:'C',d:'M30 50 A20 20 0 0 1 50 70 A20 20 0 0 1 30 90 H10'}],
  T:[{t:'I',d:'M10 10 H50'},{t:'I',d:'M30 10 V90'}],
  U:[{t:'J',d:'M10 10 V70 A20 20 0 0 0 30 90'},{t:'J',d:'M50 10 V70 A20 20 0 0 1 30 90'}],
  V:[{t:'V',d:'M10 10 L30 90 L50 10'}],
  W:[{t:'V',d:'M3 10 L16.5 90 L30 10'},{t:'V',d:'M30 10 L43.5 90 L57 10'}],
  X:[{t:'V',d:'M10 10 L30 50 L50 10'},{t:'V',d:'M10 90 L30 50 L50 90'}],
  Y:[{t:'V',d:'M10 10 L30 52 L50 10'},{t:'I',d:'M30 52 V90'}],
  Z:[{t:'V',d:'M10 10 H50 L10 90'},{t:'I',d:'M10 90 H50'}]
};
const COLORS = {I:'#e4572e',C:'#17a5a8',V:'#e8b100',L:'#6aa332',D:'#2e86ab',O:'#a23b72',P:'#7b2cbf',F:'#f18f01',J:'#0b8a63'};
const NAMES  = {I:'直線',C:'カーブ',V:'角',L:'直角',D:'D型',O:'O型',P:'P型',F:'F型',J:'フック'};

const svgOf = (ch, mode, w, h)=>{
  const parts = LETTERS[ch];
  const useCol = document.getElementById('col').checked;
  let s = `<svg viewBox="0 0 60 100" ${w?`width="${w}" height="${h}"`:''} aria-label="${ch}">`;
  for(const p of parts){
    if(mode==='slot') s += `<path class="p s" d="${p.d}"/>`;
    else if(useCol)   s += `<path class="p" style="stroke:${COLORS[p.t]}" d="${p.d}"/>`;
    else              s += `<path class="p m" d="${p.d}"/>`;
  }
  return s + '</svg>';
};

function render(){
  document.getElementById('legend').innerHTML =
    Object.keys(COLORS).map(k=>`<span><i style="background:${COLORS[k]}"></i>${k} ${NAMES[k]}</span>`).join('');
  document.getElementById('grid').innerHTML = Object.keys(LETTERS).map(ch=>{
    const n = LETTERS[ch].length, ts = LETTERS[ch].map(p=>p.t).join(' + ');
    return `<div class="card"><div class="row">${svgOf(ch,'fill')}${svgOf(ch,'slot')}</div>
      <div class="cap"><b>${ch}</b> = ${ts}</div></div>`;
  }).join('');
  const words = ['CAT','DOG','BIRD','MILK','FISH','MOON','CAKE','STAR','APPLE','WATER'];
  document.getElementById('words').innerHTML = words.map(wd=>{
    const per = Math.min(84, Math.floor(330 / wd.length)); // 1文字あたり幅(px)
    const h = Math.round(per*100/60);
    const row = mode => `<div class="w">${[...wd].map(c=>svgOf(c,mode,per,h)).join('')}</div>`;
    return `<div class="phone">${row('slot')}${row('fill')}<div class="t">${wd}（${wd.length}文字・1文字 ${per}px 幅）</div></div>`;
  }).join('');
}
const sw = document.getElementById('sw');
sw.oninput = ()=>{ document.documentElement.style.setProperty('--sw', sw.value+'px'); document.getElementById('swv').textContent = sw.value; };
document.getElementById('col').onchange = render;
render();
</script>
</body>
</html>
